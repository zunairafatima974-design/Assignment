<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Table</title>
</head>
<body>

    <h1>College Event Table</h1>

    <table border="1">
        
        <thead>
            <tr>
                <th>Event Name</th>
                <th>Date</th>
                <th>Venue</th>
                <th>Organizer</th>
            </tr>
        </thead>

        <!-- Body Rows -->
        <tbody>
            <tr>
                <td>Hackathon</td>
                <td>13 November 2026</td>
                <td>Computer Lab</td>
                <td>CSE Department</td>
            </tr>

            <tr>
                <td>Annual Function</td>
                <td>16 November 2026</td>
                <td>College Auditorium</td>
                <td>Cultural Club</td>
            </tr>

            <tr>
                <td>Sports Day</td>
                <td>23 November 2026</td>
                <td>Sports Ground</td>
                <td>Sports Club</td>
            </tr>
        </tbody>

        <!-- Footer Row -->
        <tfoot>
            <tr>
                <td colspan="4">Total Events: 3</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
