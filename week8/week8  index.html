<!DOCTYPE html>
<html>
<head>
    <title>Grid Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>My Dashboard</header>

        <aside>
            <h3>Menu</h3>
            <p>Home</p>
            <p>About</p>
            <p>Contact</p>
        </aside>

        <main>

            <div class="box">
                <span>🏠</span>
                <p>Home</p>
            </div>

            <div class="box">
                <span>👤</span>
                <p>Profile</p>
            </div>

            <div class="box">
                <span>📊</span>
                <p>Reports</p>
            </div>

            <div class="box">
                <span>📩</span>
                <p>Messages</p>
            </div>

            <div class="box">
                <span>⚙️</span>
                <p>Settings</p>
            </div>

            <div class="box">
                <span>📅</span>
                <p>Calendar</p>
            </div>

        </main>

        <footer>My Dashboard Footer</footer>

    </div>

</body>
</html>
